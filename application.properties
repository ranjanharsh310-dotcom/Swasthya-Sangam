# Swasthya Sangam - Spring Boot Configuration
# SIH 2026 Problem Statement ID: 26196 | Team: Naag Shakti

server.port=8080
spring.application.name=swasthya-sangam-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/swasthya_sangam_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS Configuration for Frontend Integration
management.endpoints.web.exposure.include=*
